name: chess-coach

services:
  api:
    container_name: chess-coach-api
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    profiles:
      - docker-api
    ports:
      - "8081:8000"
    volumes:
      - ./apps/api:/var/www/html
    environment:
      APP_ENV: local
      APP_URL: http://api.calvertchess.test
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: calvert_chess_coach_journal
      DB_USERNAME: chess_coach
      DB_PASSWORD: secret
      REDIS_HOST: redis
      STOCKFISH_BINARY: /usr/games/stockfish
    extra_hosts:
      - "api.calvertchess.test:host-gateway"
      - "web.calvertchess.test:host-gateway"
    depends_on:
      - db
      - redis
    networks:
      - chess-coach

  web:
    container_name: chess-coach-web
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - ./apps/web:/app
      - chess-coach-web-node-modules:/app/node_modules
    environment:
      NEXT_PUBLIC_APP_URL: http://web.calvertchess.test
      NEXT_PUBLIC_API_URL: http://api.calvertchess.test
    extra_hosts:
      - "api.calvertchess.test:host-gateway"
      - "web.calvertchess.test:host-gateway"
    networks:
      - chess-coach

  db:
    container_name: chess-coach-db
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: calvert_chess_coach_journal
      POSTGRES_USER: chess_coach
      POSTGRES_PASSWORD: secret
    volumes:
      - chess-coach-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - chess-coach

  redis:
    container_name: chess-coach-redis
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - chess-coach

  engine:
    container_name: chess-coach-engine
    build:
      context: .
      dockerfile: infra/docker/engine/Dockerfile
    profiles:
      - engine
    volumes:
      - ./apps/engine:/worker
    environment:
      REDIS_HOST: redis
      API_INTERNAL_URL: http://api.calvertchess.test
      STOCKFISH_BINARY: /usr/games/stockfish
    extra_hosts:
      - "api.calvertchess.test:host-gateway"
    depends_on:
      - redis
    networks:
      - chess-coach

volumes:
  chess-coach-postgres:
  chess-coach-web-node-modules:

networks:
  chess-coach:
    name: chess-coach
